<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Passkey-Demo</title>
<style>body{font-family:system-ui;background:#f4f6fa;display:flex;justify-content:center;padding-top:50px}main{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px #0002;width:360px}button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:7px;background:#2c5ae9;color:#fff;font-size:15px}input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bcc6d4;border-radius:7px;font-size:15px;margin-top:6px}#status{margin-top:14px;font-family:monospace;font-size:12px;white-space:pre-wrap}</style></head>
<body><main>
<h2 style="margin:0">Passkey-Demo</h2>
<p style="color:#556;font-size:13px">Relying Party „localhost“ – prüft Signaturen im Browser.</p>
<label>Benutzername<input id="user" autocomplete="username webauthn" value=""></label>
<button id="register">Passkey registrieren</button>
<button id="login">Mit Passkey anmelden</button>
<button id="conditional">Autofill-Anmeldung starten</button>
<div id="status" data-state="idle">bereit</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
const status = (state, text) => { $("status").dataset.state = state; $("status").textContent = text; };
const store = JSON.parse(localStorage.getItem("rp") || "{}");
const save = () => localStorage.setItem("rp", JSON.stringify(store));
function derToRaw(der) {
  const d = new Uint8Array(der); let i = 2; const out = [];
  for (let k = 0; k < 2; k++) { i++; const len = d[i++]; let v = d.slice(i, i + len); i += len; while (v.length > 32 && v[0] === 0) v = v.slice(1); const p = new Uint8Array(32); p.set(v, 32 - v.length); out.push(p); }
  const r = new Uint8Array(64); r.set(out[0]); r.set(out[1], 32); return r;
}
async function sha(buf) { return new Uint8Array(await crypto.subtle.digest("SHA-256", buf)); }
$("register").onclick = async () => {
  try {
    status("busy", "registriere …");
    const challenge = rnd(32);
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { id: "localhost", name: "Passkey-Demo" },
      user: { id: enc.encode("demo-" + ($("user").value || "user")), name: $("user").value || "demo-user", displayName: "Demo" },
      challenge, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { residentKey: "required", userVerification: "preferred" },
      extensions: { credProps: true },
    }});
    const cd = JSON.parse(new TextDecoder().decode(cred.response.clientDataJSON));
    if (cd.type !== "webauthn.create" || cd.challenge !== b64u(challenge) || cd.origin !== location.origin) throw new Error("clientData falsch");
    if (!(cred instanceof PublicKeyCredential)) throw new Error("kein PublicKeyCredential");
    const ad = new Uint8Array(cred.response.getAuthenticatorData());
    if (b64u(ad.slice(0, 32)) !== b64u(await sha(enc.encode("localhost")))) throw new Error("rpIdHash falsch");
    store.cred = { id: cred.id, spki: b64u(cred.response.getPublicKey()), alg: cred.response.getPublicKeyAlgorithm() };
    save();
    status("registered", "registriert: " + cred.id + " rk=" + JSON.stringify(cred.getClientExtensionResults().credProps));
  } catch (e) { status("error", "Fehler: " + e.name + ": " + e.message); }
};
async function verify(cred, challenge) {
  const cd = JSON.parse(new TextDecoder().decode(cred.response.clientDataJSON));
  if (cd.type !== "webauthn.get" || cd.challenge !== b64u(challenge) || cd.origin !== location.origin) throw new Error("clientData falsch");
  if (!store.cred || store.cred.id !== cred.id) throw new Error("unbekannter Passkey " + cred.id);
  const key = await crypto.subtle.importKey("spki", Uint8Array.from(atob(store.cred.spki.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(store.cred.spki.length / 4) * 4, "=")), c => c.charCodeAt(0)), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
  const ad = new Uint8Array(cred.response.authenticatorData);
  const data = new Uint8Array(ad.length + 32); data.set(ad); data.set(await sha(cred.response.clientDataJSON), ad.length);
  const ok = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, derToRaw(cred.response.signature), data);
  if (!ok) throw new Error("Signatur ungültig");
  return { user: new TextDecoder().decode(cred.response.userHandle), uv: !!(ad[32] & 4) };
}
$("login").onclick = async () => {
  try {
    status("busy", "melde an …");
    const challenge = rnd(32);
    const cred = await navigator.credentials.get({ publicKey: { rpId: "localhost", challenge, userVerification: "preferred" } });
    const r = await verify(cred, challenge);
    status("loggedin", "angemeldet als " + r.user + " (Signatur gültig, UV=" + r.uv + ")");
  } catch (e) { status("error", "Fehler: " + e.name + ": " + e.message); }
};
$("conditional").onclick = async () => {
  try {
    status("waiting", "warte auf Auswahl im Autofill …");
    const challenge = rnd(32);
    const cred = await navigator.credentials.get({ mediation: "conditional", publicKey: { rpId: "localhost", challenge, userVerification: "discouraged" } });
    const r = await verify(cred, challenge);
    status("loggedin", "angemeldet (Autofill) als " + r.user + " (Signatur gültig, UV=" + r.uv + ")");
  } catch (e) { status("error", "Fehler: " + e.name + ": " + e.message); }
};
</script></body></html>
