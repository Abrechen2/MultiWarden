<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Shop – Anmelden</title>
<style>body{font-family:system-ui;background:#f4f6fa;display:flex;justify-content:center;padding-top:60px}form{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px #0002;width:320px}label{display:block;font-size:13px;margin:10px 0 4px;color:#445}input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bcc6d4;border-radius:7px;font-size:15px}button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:7px;background:#0a7d4f;color:#fff;font-size:15px}</style></head>
<body><form method="post" action="/welcome.html">
<h2 style="margin:0 0 6px">Beim Shop anmelden</h2>
