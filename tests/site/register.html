<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Registrieren</title>
<style>body{font-family:system-ui;background:#f4f6fa;display:flex;justify-content:center;padding-top:60px}form{background:#fff;padding:28px;border-radius:12px;width:320px}label{display:block;font-size:13px;margin:10px 0 4px}input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bcc6d4;border-radius:7px;font-size:15px}</style></head>
<body><form method="post" action="/welcome.html">
<h2 style="margin:0 0 6px">Konto erstellen</h2>
<label for="r-mail">E-Mail</label><input id="r-mail" name="email" type="email">
<label for="r-pw">Passwort</label><input id="r-pw" name="password" type="password" autocomplete="new-password">
<label for="r-pw2">Passwort wiederholen</label><input id="r-pw2" name="password_confirm" type="password">
<button type="submit">Registrieren</button></form></body></html>
