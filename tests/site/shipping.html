<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shipping</title></head>
<body style="font-family:system-ui;padding:30px">
<form id="ship"><h3>Shipping address</h3>
<input id="s-name" autocomplete="shipping name" placeholder="Full name"><br>
<input id="s-org" autocomplete="organization" placeholder="Company"><br>
<textarea id="s-addr" autocomplete="shipping street-address" placeholder="Address"></textarea><br>
<input id="s-city" autocomplete="shipping address-level2" placeholder="City"><br>
<input id="s-zip" autocomplete="shipping postal-code" placeholder="ZIP"><br>
<select id="s-country" autocomplete="shipping country"><option value="">Country</option><option value="276">Germany</option><option value="040">Austria</option><option value="840">United States</option></select><br>
<input id="s-mail" autocomplete="email" placeholder="Email"><br>
<button>Continue</button></form></body></html>
