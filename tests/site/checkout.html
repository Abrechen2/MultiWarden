<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Kasse</title>
<style>body{font-family:system-ui;background:#f4f6fa;padding:30px}form{background:#fff;padding:22px;border-radius:12px;width:380px;box-shadow:0 2px 12px #0002}label{display:block;font-size:13px;margin:10px 0 4px}input,select{padding:8px;border:1px solid #bcc6d4;border-radius:7px;font-size:15px}input{width:100%;box-sizing:border-box}iframe{border:1px solid #ccc;width:420px;height:200px;margin-top:16px}</style></head>
<body>
<form id="pay">
  <h3>Zahlung</h3>
  <label for="holder">Karteninhaber</label><input id="holder" name="holder">
  <label for="ccnum">Kartennummer</label><input id="ccnum" name="ccnum" inputmode="numeric">
  <label>Gültig bis</label>
  <select id="exp-m" name="exp_month" aria-label="Ablaufdatum Monat"><option value="">Monat</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option></select>
  <select id="exp-y" name="exp_year" aria-label="Ablaufdatum Jahr"><option value="">Jahr</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select>
  <label for="cvc">Prüfnummer (CVC)</label><input id="cvc" name="cvc" maxlength="4">
  <label for="brand">Kartentyp</label><select id="brand" name="card_type"><option value="">Bitte wählen</option><option value="MC">Mastercard</option><option value="VI">Visa</option><option value="AX">American Express</option></select>
  <button type="submit">Bezahlen</button>
</form>
<iframe src="http://127.0.0.1:9000/payframe.html"></iframe>
<iframe src="http://127.0.0.1:9000/adframe.html"></iframe>
</body></html>
