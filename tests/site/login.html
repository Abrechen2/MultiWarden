<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Test-Login</title>
<style>body{font-family:system-ui;background:#f4f6fa;display:flex;justify-content:center;padding-top:60px}form{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px #0002;width:320px}label{display:block;font-size:13px;margin:10px 0 4px;color:#445}input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bcc6d4;border-radius:7px;font-size:15px}button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:7px;background:#2c5ae9;color:#fff;font-size:15px}#out{margin-top:12px;font-family:monospace;font-size:12px;color:#063}</style></head>
<body><form id="f" autocomplete="on">
<h2 style="margin:0 0 6px">Anmelden</h2>
<label for="u">Benutzername</label><input id="u" name="username" type="text" autocomplete="username">
<label for="p">Passwort</label><input id="p" name="password" type="password" autocomplete="current-password">
<button type="submit">Login</button><div id="out"></div></form>
<script>
// emulate a controlled input (React-like): state only updates via input events
const state = {u:"", p:""};
document.getElementById("u").addEventListener("input", e => state.u = e.target.value);
document.getElementById("p").addEventListener("input", e => state.p = e.target.value);
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); document.getElementById("out").textContent = "state=" + JSON.stringify(state); });
</script></body></html>
